name: Unified Release — all ECAssistant packages

# ONE tag, ONE wave: TestSupport + LLM + Core + TUI + Console all carry the
# SAME version number and are packed + pushed together in this workflow.
# No per-repo tags, no CI restore race — all repos are checked out side by
# side and built with sibling project references.
#
# Trigger:  push tag  release-v15.0.0     OR  manual dispatch with version input
# Result:   5 packages on GitHub Packages + nuget.org, all at <version>

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unified package version (e.g. 15.0.0)'
        required: true
        default: '15.0.0'
  push:
    tags:
      - 'release-v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_NODE_REUSE: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/release-v}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi

      # ── Checkout all 5 repos as siblings (relative ProjectReference layout) ──
      - name: Checkout Core (this repo)
        uses: actions/checkout@v4
        with:
          path: ECAssistantCore

      - name: Checkout LLM
        uses: actions/checkout@v4
        with:
          repository: SideDevEC/ECAssistantLLM
          path: ECAssistantLLM

      - name: Checkout TUI
        uses: actions/checkout@v4
        with:
          repository: SideDevEC/ECAssistantTUI
          path: ECAssistantTUI

      - name: Checkout Console
        uses: actions/checkout@v4
        with:
          repository: SideDevEC/ECAssistantConsole
          path: ECAssistantConsole

      - name: Checkout TestSupport
        uses: actions/checkout@v4
        with:
          repository: SideDevEC/ECAssistantTestSupport
          path: ECAssistantTestSupport

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add GitHub Packages source (restore of released deps)
        run: |
          dotnet nuget add source \
            --username SideDevEC \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            https://nuget.pkg.github.com/SideDevEC/index.json

      # ── Lockstep version stamping — no commits needed ──
      - name: Stamp unified version into all csprojs + RequiredServerVersion
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Stamping unified version $VERSION"
          find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" \
            | xargs perl -pi -e "s/(PackageReference Include=\"ECAssistant[^\"]*\" Version=\")[^\"]+(\")/\${1}$ENV{VERSION}\${2}/g"
          find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" \
            | xargs perl -pi -e "s/(<Version>)[^<]+(<\/Version>)/\${1}$ENV{VERSION}\${2}/g"
          find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" \
            | xargs perl -pi -e "s/(<PackageVersion>)[^<]+(<\/PackageVersion>)/\${1}$ENV{VERSION}\${2}/g"
          # ServerInstallCoordinator.RequiredServerVersion must equal the unified version
          perl -pi -e "s/(RequiredServerVersion = \")[^\"]+(\")/\${1}$ENV{VERSION}\${2}/g" \
            ECAssistantCore/Setup/ServerInstallCoordinator.cs
          # Verify: no stale inter-package versions remain
          ! grep -rn 'PackageReference Include="ECAssistant' --include="*.csproj" . \
            | grep -v "Version=\"$VERSION\"" || (echo "::error::stale PackageReference versions found"; exit 1)

      - name: Build ALL projects (Release) — gate before pack
        env:
          EcaUseProjectRefs: 'true'
        run: |
          dotnet build ECAssistantTestSupport/ECAssistant.TestSupport.csproj -c Release
          dotnet build ECAssistantLLM/ECAssistant.LLM.csproj -c Release
          dotnet build ECAssistantCore/ECAssistant.Core.csproj -c Release
          dotnet build ECAssistantCore/Tests/ECAssistant.Core.Tests.csproj -c Release
          dotnet build ECAssistantTUI/ECAssistant.TUI.csproj -c Release
          dotnet build ECAssistantConsole/ECAssistantConsole.csproj -c Release

      - name: Pack all 5 packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p nupkg
          dotnet pack ECAssistantTestSupport/ECAssistant.TestSupport.csproj -c Release --no-build /p:PackageVersion=$VERSION -o nupkg
          dotnet pack ECAssistantLLM/ECAssistant.LLM.csproj           -c Release --no-build /p:PackageVersion=$VERSION -o nupkg
          dotnet pack ECAssistantCore/ECAssistant.Core.csproj         -c Release --no-build /p:PackageVersion=$VERSION -o nupkg
          dotnet pack ECAssistantTUI/ECAssistant.TUI.csproj           -c Release --no-build /p:PackageVersion=$VERSION -o nupkg
          dotnet pack ECAssistantConsole/ECAssistantConsole.csproj    -c Release --no-build /p:PackageVersion=$VERSION -o nupkg
          echo "--- nupkg contents ---"
          ls -la nupkg/
          # Assert exactly the 5 package IDs, ALL at $VERSION
          EXPECTED="ECAssistant.Core.$VERSION ECAssistant.TUI.$VERSION ECAssistant.Console.$VERSION ECAssistant.LLM.Server.$VERSION ECAssistant.Core.TestSupport.$VERSION"
          for pkg in $EXPECTED; do
            ls nupkg/$pkg.nupkg > /dev/null || { echo "::error::missing $pkg.nupkg"; exit 1; }
          done
          COUNT=$(ls nupkg/*.nupkg | wc -l)
          [ "$COUNT" -eq 5 ] || { echo "::error::expected 5 packages, got $COUNT"; exit 1; }

      - name: Push all to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/SideDevEC/index.json \
            --timeout 900 --skip-duplicate

      - name: Log in to nuget.org (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: SideDevEC

      - name: Push all to nuget.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --timeout 900 --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unified-release-${{ steps.version.outputs.version }}
          path: ./nupkg/*.nupkg
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Unified Release ${{ steps.version.outputs.version }}
          body: |
            Unified release wave — ALL packages at ${{ steps.version.outputs.version }}:
            - ECAssistant.Core
            - ECAssistant.TUI
            - ECAssistant.Console
            - ECAssistant.LLM.Server
            - ECAssistant.Core.TestSupport

      - name: Verify wave on nuget.org
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Indexing can lag a few minutes; poll briefly, report (non-fatal on lag)
          for id in ECAssistant.Core ECAssistant.TUI ECAssistant.Console ECAssistant.LLM.Server ECAssistant.Core.TestSupport; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/$id/$VERSION/$id.$VERSION.nupkg")
            echo "$id $VERSION → HTTP $code (404 = still indexing, fine)"
          done